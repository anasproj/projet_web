stages:
  - test
  - build

tests_unitaires:
  stage: test
  image: denoland/deno:alpine
  script:
    - echo "Lancement des tests automatiques..."
    - deno test --allow-all backend/

lint_code:
  stage: test
  image: denoland/deno:alpine
  script:
    - echo "Lancement du linter Deno..."
    - deno lint backend/

build_images:
  stage: build
  image: docker:24.0.5
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest -f backend/Dockerfile .
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest -f frontend/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main

