<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Foot Stats</title>
  <meta name="description" content="Suivez vos stats de foot en direct, créez des lobbys et disputez des matchs avec vos amis." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="navbar" class="navbar">
    <a href="#/" class="nav-brand">
      <span class="brand-icon">⚽</span>
      <span>LiveFootStats</span>
    </a>
    <div class="nav-links">
      <a href="#/home" class="nav-link">Lobbys</a>
      <a href="#/ranking" class="nav-link">Classement</a>
      <a href="#/profile" class="nav-link">Mon Profil</a>
      <button id="nav-logout" class="btn btn-outline btn-sm">Déconnexion</button>
    </div>
  </nav>

  <main id="app">
    <div class="page-loader">
      <div class="loader-spinner"></div>
    </div>
  </main>

  <div id="goal-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-title">⚽ Enregistrer un but</h3>
      <p class="modal-subtitle">Enregistrez les détails du but en temps réel.</p>
      
      <div class="modal-section" style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label class="modal-label">Équipe qui a marqué :</label>
          <select id="goal-team" class="form-input" style="width:100%; box-sizing:border-box;" required></select>
        </div>
        
        <div>
          <label class="modal-label">Buteur :</label>
          <select id="goal-scorer" class="form-input" style="width:100%; box-sizing:border-box;"></select>
        </div>
        
        <div>
          <label class="modal-label">Passeur décisif :</label>
          <select id="goal-assist" class="form-input" style="width:100%; box-sizing:border-box;"></select>
        </div>

        <div>
          <label class="modal-label">Minute du but :</label>
          <input id="goal-minute" type="number" min="1" max="120" class="form-input" style="width:100%; box-sizing:border-box;" required />
        </div>

        <div id="goal-error" class="auth-message error hidden" style="margin-top:0;"></div>
      </div>

      <div class="modal-actions" style="margin-top: 20px;">
        <button id="goal-confirm" class="btn btn-success">Confirmer</button>
        <button id="goal-cancel" class="btn btn-outline">Annuler</button>
      </div>
    </div>
  </div>

  <div id="lobby-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-title">🏆 Créer un nouveau Lobby</h3>
      <p class="modal-subtitle">Configurez un match en direct pour commencer à enregistrer des scores.</p>
      
      <div class="modal-section" style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label class="modal-label">Équipe Domicile :</label>
          <select id="lobby-home-team" class="form-input" style="width:100%; box-sizing:border-box;"></select>
        </div>
        
        <div>
          <label class="modal-label">Équipe Extérieur :</label>
          <select id="lobby-away-team" class="form-input" style="width:100%; box-sizing:border-box;"></select>
        </div>

        <div id="lobby-error" class="auth-message error hidden" style="margin-top:0;"></div>
      </div>

      <div class="modal-actions">
        <button id="lobby-confirm" class="btn btn-success">Créer le Match</button>
        <button id="lobby-cancel" class="btn btn-outline">Annuler</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
