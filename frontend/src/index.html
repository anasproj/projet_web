<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Foot Stats</title>
  <meta name="description" content="Suivez vos stats de foot en direct, créez des lobbys et disputez des matchs avec vos amis." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav id="navbar" class="navbar">
    <a href="#/" class="nav-brand">
      <span class="brand-icon">⚽</span>
      <span>LiveFootStats</span>
    </a>
    <div class="nav-links">
      <a href="#/home" class="nav-link">Lobbys</a>
      <a href="#/ranking" class="nav-link">Classement</a>
      <a href="#/profile" class="nav-link">Mon Profil</a>
      <button id="nav-logout" class="btn btn-outline btn-sm">Déconnexion</button>
    </div>
  </nav>

  <main id="app">
    <div class="page-loader">
      <div class="loader-spinner"></div>
    </div>
  </main>

  <div id="goal-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width: 500px; width: 90%;">
      <div id="goal-modal-content">
        <!-- Rendu dynamique par étapes -->
      </div>
    </div>
  </div>

  <div id="lobby-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-title">🏆 Créer un nouveau Lobby</h3>
      <p class="modal-subtitle">Configurez un match en direct pour commencer à enregistrer des scores.</p>
      
      <div class="modal-section" style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label class="modal-label">Nom du Match :</label>
          <input type="text" id="lobby-name" class="form-input" placeholder="Ex: Finale Tournoi, Match Amical..." style="width:100%; box-sizing:border-box;">
        </div>
        
        <div style="display:flex; gap:10px;">
          <div style="flex:1;">
            <label class="modal-label">Durée :</label>
            <select id="lobby-duration" class="form-input" style="width:100%; box-sizing:border-box;">
              <option value="10">10 min</option>
              <option value="20">20 min</option>
              <option value="90" selected>90 min</option>
              <option value="unlimited">Sans limite</option>
            </select>
          </div>
          <div style="flex:1;">
            <label class="modal-label">Joueurs/équipe :</label>
            <select id="lobby-max-players" class="form-input" style="width:100%; box-sizing:border-box;" onchange="if(this.value==='custom') { document.getElementById('lobby-custom-players').classList.remove('hidden'); } else { document.getElementById('lobby-custom-players').classList.add('hidden'); }">
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="11" selected>11</option>
              <option value="custom">Autre (choix)</option>
            </select>
            <input type="number" id="lobby-custom-players" class="form-input hidden" placeholder="Nb joueurs" style="width:100%; box-sizing:border-box; margin-top:5px;">
          </div>
        </div>

        <div id="lobby-error" class="auth-message error hidden" style="margin-top:0;"></div>
      </div>

      <div class="modal-actions">
        <button id="lobby-confirm" class="btn btn-success">Créer le Match</button>
        <button id="lobby-cancel" class="btn btn-outline">Annuler</button>
      </div>
    </div>
  </div>

  <div id="delete-lobby-modal" class="modal-overlay hidden" style="z-index: 999999;">
    <div class="modal-box delete-lobby-box" role="dialog" aria-modal="true" aria-labelledby="delete-lobby-title">
      <div style="font-size: 3rem; line-height: 1; margin-bottom: 14px;">🗑️</div>
      <h3 id="delete-lobby-title" class="modal-title">Supprimer ce lobby ?</h3>
      <p class="modal-subtitle" style="margin-bottom: 18px;">
        Cette action est irréversible. Le lobby, les joueurs, les messages et les buts liés seront supprimés.
      </p>
      <div id="delete-lobby-error" class="auth-message error hidden" style="margin-bottom: 14px;"></div>
      <div class="modal-actions" style="justify-content: center; flex-wrap: wrap;">
        <button id="delete-lobby-confirm" type="button" class="btn" style="background: var(--danger); color: white; min-width: 170px;">Oui, supprimer</button>
        <button id="delete-lobby-cancel" type="button" class="btn btn-outline" style="min-width: 120px;">Annuler</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=admin-panel-20260530-1"></script>
</body>
</html>
