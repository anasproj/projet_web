version: '3.8'

# Définit les conteneurs de l'application.
services:

  # Configuration de la base de données PostgreSQL.
  database:
    image: postgres:16-alpine
    container_name: foot_db
    # Redémarre automatiquement le conteneur en cas d'arrêt.
    restart: always
    # Injecte les identifiants de connexion depuis le fichier .env ou utilise des valeurs par défaut.
    environment:
      POSTGRES_USER: ${DB_USER:-foot_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-superpassword123}
      POSTGRES_DB: ${DB_NAME:-foot_app}
    volumes:
      # Persiste les données de la base dans un volume Docker managé.
      - db_data:/var/lib/postgresql/data
      # Exécute le script d'initialisation SQL au premier démarrage du conteneur.
      - ./database:/docker-entrypoint-initdb.d
    # Vérifie régulièrement que la base de données accepte les connexions.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-foot_admin}", "-d", "${DB_NAME:-foot_app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Configuration du serveur d'API Deno.
  backend:
    # Construit l'image Docker à partir du Dockerfile spécifié.
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: foot_backend
    restart: always
    # Expose le port sécurisé HTTPS.
    ports:
      - "3000:3000"
    depends_on:
      database:
        # Bloque le démarrage du backend tant que la base de données n'est pas saine.
        condition: service_healthy
    # Fournit les variables d'environnement nécessaires au fonctionnement de l'API.
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-foot_admin}
      - DB_PASSWORD=${DB_PASSWORD:-superpassword123}
      - DB_NAME=${DB_NAME:-foot_app}
      - PEPPER_SECRET=${PEPPER_SECRET:-secret_poivre}
      - JWT_SECRET=${JWT_SECRET:-secret_jwt}
    volumes:
      # Monte le dossier source pour que les modifications se reflètent sans reconstruire l'image.
      - ./backend/src:/app/src
      # Monte les certificats SSL en lecture seule pour activer le HTTPS.
      - ./certs:/app/certs:ro

  # Configuration du serveur web Nginx.
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: foot_frontend
    restart: always
    # Expose le port HTTP pour l'accès depuis le navigateur.
    ports:
      - "8080:8080"
    volumes:
      # Monte les fichiers statiques de l'interface utilisateur.
      - ./frontend/src:/usr/share/nginx/html:ro
      # Remplace la configuration par défaut de Nginx par la nôtre.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

# Déclare les volumes gérés par Docker.
volumes:
  # Stocke les données persistantes de PostgreSQL en dehors du cycle de vie du conteneur.
  db_data: