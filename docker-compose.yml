version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: foot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-foot_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-superpassword123}
      POSTGRES_DB: ${DB_NAME:-foot_app}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d # Exécutera le init.sql de la Personne B
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-foot_admin}", "-d", "${DB_NAME:-foot_app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: foot_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy # Attend que la DB soit prête à 100%
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${DB_USER:-foot_admin}
      - DB_PASSWORD=${DB_PASSWORD:-superpassword123}
      - DB_NAME=${DB_NAME:-foot_app}
      - PEPPER_SECRET=${PEPPER_SECRET:-secret_poivre}
      - JWT_SECRET=${JWT_SECRET:-secret_jwt}
    volumes:
      - ./backend/src:/app/src # Rechargement du code en dev
      - ./certs:/app/certs:ro  # Lecture seule des certificats

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: foot_frontend
    restart: always
    ports:
      - "8080:80" # Navigable sur http://localhost:8080
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data: