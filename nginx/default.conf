server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /app.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
        try_files /app.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}