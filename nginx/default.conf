server {
    listen 8080;
    server_name localhost;

    # Définit le répertoire racine où Nginx cherche les fichiers à servir.
    root /usr/share/nginx/html;
    index index.html;

    # Active la compression Gzip pour réduire la taille des fichiers envoyés au navigateur.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Désactive le cache navigateur pour app.js afin que les mises à jour soient chargées immédiatement.
    location = /app.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
        try_files /app.js =404;
    }

    # Redirige toutes les routes inconnues vers index.html pour permettre le routage côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}